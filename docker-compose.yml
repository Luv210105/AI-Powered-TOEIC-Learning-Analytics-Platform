# docker-compose.yml
# Hạ tầng tối thiểu cho Phase 1: MinIO (object storage) + PostgreSQL.
# Các service nặng hơn (Kafka, Spark, Flink, Airflow, DataHub) sẽ được thêm dần ở các phase sau.
# Mọi thông tin nhạy cảm (user/password) lấy từ file .env — KHÔNG hardcode ở đây.

services:
  # ---------------------------------------------------------------------------
  # MinIO — object storage tương thích S3, dùng làm data lake (landing + Delta).
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: toeic-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (giao diện trình duyệt)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # createbuckets — chạy MỘT LẦN để tạo sẵn 4 bucket rồi tự thoát.
  # Phụ thuộc vào minio đã healthy trước khi chạy.
  # ---------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:latest
    container_name: toeic-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/landing;
      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      echo '>> Buckets landing/bronze/silver/gold đã sẵn sàng';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # ---------------------------------------------------------------------------
  # PostgreSQL — đóng 2 vai: (1) source DB mô phỏng department khác,
  # (2) Gold warehouse cho BI ở các phase sau.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: toeic-postgres
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (tránh đụng Postgres cài sẵn trên máy)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark master — điều phối cluster + Spark Master UI (cổng 8080).
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: toeic-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Master RPC (worker + submit kết nối vào đây)
      - "4040:4040"   # Application UI (khi chạy job — nơi xem stage/task/skew)
    volumes:
      - ./processing/spark:/opt/spark-apps   # code Spark job
      - ./data:/data                          # (dự phòng) truy cập data local nếu cần
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark worker — nơi thực thi task. Kết nối tới master qua service name.
  # ---------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.3
    container_name: toeic-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    ports:
      - "8081:8081"   # Worker UI
    volumes:
      - ./processing/spark:/opt/spark-apps
      - ./data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka — message broker cho streaming events (KRaft mode, không cần Zookeeper).
  # 2 listener: EXTERNAL (localhost:9092) cho generator ở host; INTERNAL
  # (kafka:29092) cho Flink trong cùng mạng compose.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: toeic-kafka
    ports:
      - "9092:9092"   # client từ HOST (generator kết nối localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Flink jobmanager — điều phối stream job + Flink UI (cổng 8082).
  # Dùng image tùy chỉnh (Flink + Python + Kafka connector).
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: toeic-flink:1.18
    container_name: toeic-flink-jobmanager
    command: jobmanager
    ports:
      - "8082:8081"   # Flink UI (host 8082 — tránh đụng spark-worker 8081)
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./processing/flink:/opt/flink/jobs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Flink taskmanager — nơi thực thi task streaming.
  # ---------------------------------------------------------------------------
  flink-taskmanager:
    image: toeic-flink:1.18
    container_name: toeic-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./processing/flink:/opt/flink/jobs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow (standalone) — orchestrate DP1/DP2/DP3. Trigger job qua docker exec.
  # ---------------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: toeic-airflow:2.10
    container_name: toeic-airflow
    command: standalone
    group_add:
      - "973"          # GID group docker -> Airflow truy cập /var/run/docker.sock
    ports:
      - "8083:8080"    # Airflow UI (host 8083 — tránh 8080 của Spark master)
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # connections & variables (hiện trong Airflow UI)
      AIRFLOW_CONN_POSTGRES_GOLD: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      AIRFLOW_VAR_SPARK_MASTER: "spark://spark-master:7077"
      AIRFLOW_VAR_MINIO_ENDPOINT: "http://minio:9000"
      # cho validate scripts (chạy trong Airflow) nối Postgres nội bộ
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - ./processing:/opt/airflow/repo/processing
      - ./generator:/opt/airflow/repo/generator
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Named volumes — giữ dữ liệu không mất khi tắt/khởi động lại container.
# -----------------------------------------------------------------------------
volumes:
  minio_data:
  postgres_data:
